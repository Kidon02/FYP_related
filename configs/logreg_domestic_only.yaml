# Config: Logistic Regression, Domestic-Only feature set, baseline labels
# Interpretable-by-design comparison model (Research Question 5)

experiment_name: logreg_domestic_only_gspc

data:
  panel_path: data/processed/panel_full.csv
  target_index: GSPC
  feature_set: domestic_only  # options: domestic_only, cross_market
  label_strategy: baseline    # options: baseline, regime_hmm

split:
  train_start: 2000-01-01
  train_end: 2015-12-31
  val_start: 2016-01-01
  val_end: 2018-12-31
  test_start: 2019-01-01
  test_end: 2024-12-31

imbalance:
  method: smote
  sampling_strategy: auto

model:
  type: logistic_regression
  params:
    penalty: l2
    C: 1.0
    max_iter: 1000
    solver: lbfgs

evaluation:
  metrics: [pr_auc, f1, mcc]
  n_seeds: 5
  seed_base: 42

explainability:
  run_shap: false   # coefficients are directly interpretable; SHAP not required here

output:
  checkpoint_path: results/checkpoints/logreg_domestic_only_gspc.pkl
  log_path: logs/logreg_domestic_only_gspc.log
