# Baseline model comparison: XGBoost and L2 logistic regression.
# Run for each target with: python code/baseline_models.py --index GSPC

split:
  train: [2000-01-01, 2015-12-31]
  validation: [2016-01-01, 2018-12-31]
  test: [2019-01-01, 2024-12-31]

seeds:
  base: 42
  n: 5                  # seeds 42-46; mean and std reported

imbalance:
  method: smote         # fitted on the training set only, after scaling
  k_neighbors: 5
  sampling_strategy: auto

scaler: standard        # fitted on the training set only

selection:
  # Hyperparameters chosen by mean validation PR-AUC across the seeds.
  metric: pr_auc
  # Decision threshold chosen per seed by maximising F1 on validation only.
  threshold: max_f1_on_validation

models:
  xgboost:
    fixed:
      objective: binary:logistic
      eval_metric: aucpr
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: hist
      device: cpu
    grid:
      max_depth: [2, 4]
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
  logistic_regression:
    fixed:
      solver: lbfgs
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1, 10]

# Label sets are columns of results/labels_{IDX}.csv (code/labelling.py): baseline
# z-score, regime-dependent threshold (causal HMM), regime-standardised (causal HMM).
label_sets: [baseline, hmm, regime_std]
# Feature sets are defined in configs/features.yaml.
feature_set_names: [domestic_only, cross_market, cross_market_lag0, ablation_foreign, ablation_macro, rv_only]

# Sensitivity analysis: regime-dependent threshold labels from the original
# full-sample HMM (which uses future data), on the main comparison only.
sensitivity:
  label_sets: [hmm_fullsample]
  feature_set_names: [domestic_only, cross_market]

# 95% CIs for test PR-AUC, F1 and MCC (2019-2024): percentile intervals of the
# seed-mean metric over moving-block bootstrap resamples of the test days. A block
# never cuts an anomaly cluster (anomaly days at most cluster_gap trading days apart):
# it may not start inside one, and is extended to the cluster's end if it would end
# inside one.
bootstrap:
  n_resamples: 2000
  block_length: 21      # trading days, about one month
  cluster_gap: 5        # trading days
  confidence: 0.95
  seed: 2026
