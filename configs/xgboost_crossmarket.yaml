# Config: XGBoost, Cross-Market feature set, regime-conditioned labels
# Target market: S&P 500 (change target_index to run for Nikkei/FTSE)

experiment_name: xgboost_crossmarket_gspc

data:
  panel_path: data/processed/panel_full.csv
  target_index: GSPC
  feature_set: cross_market   # options: domestic_only, cross_market
  label_strategy: regime_hmm  # options: baseline, regime_hmm

split:
  train_start: 2000-01-01
  train_end: 2015-12-31
  val_start: 2016-01-01
  val_end: 2018-12-31
  test_start: 2019-01-01
  test_end: 2024-12-31

imbalance:
  method: smote
  sampling_strategy: auto

model:
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: aucpr

evaluation:
  metrics: [pr_auc, f1, mcc]
  n_seeds: 5          # run with 5 different seeds, report mean +/- std dev
  seed_base: 42

explainability:
  run_shap: true
  global_shap: true
  local_shap_events: ["2008-09-15", "2020-03-16", "2015-08-24"]  # Lehman, COVID crash, China devaluation
  rolling_shap_stretch_goal: false  # set true only once primary questions are done

output:
  checkpoint_path: results/checkpoints/xgboost_crossmarket_gspc.pkl
  log_path: logs/xgboost_crossmarket_gspc.log
